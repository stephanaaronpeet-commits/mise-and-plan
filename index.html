<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0B0B0C"/>
  <title>Mise &amp; Plan</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="icon" href="/icon-192.png"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800;900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="/src/core/design.css"/>
</head>
<body>

<header class="masthead">
  <div class="wordmark">Mise<span class="amp">&amp;</span>Plan</div>
  <div class="submark">Eat to train · Train to eat</div>
</header>

<nav class="app-nav" id="app-nav">
  <button data-route="cookbook" class="active">Cookbook</button>
  <button data-route="plan"     disabled>Plan <span class="soon">SOON</span></button>
  <button data-route="shop"     disabled>Shop <span class="soon">SOON</span></button>
  <button data-route="stats"    disabled>Stats <span class="soon">SOON</span></button>
</nav>

<main id="app">
  <!-- Active module mounts here -->
  <div class="boot-state">
    <div class="boot-stamp">BOOTING…</div>
  </div>
</main>

<footer class="colophon">
  <span>Mise &amp; Plan · v0.1</span>
  <span class="dot">·</span>
  <span>Built for the kitchen</span>
</footer>

<script type="module" src="/src/core/main.js"></script>
</body>
</html>
